name: Build code lists

# Packages the curated gecko code lists in codelists/ and publishes them as a
# rolling "codes-latest" release, so every push to main leaves a downloadable,
# ready-to-drop-in GYQE01.ini per list -- built by CI from sources on main
# rather than exported by hand from somebody's local Rio ini.
#
# build-check.yml already proves every code in the repo still compiles. This
# workflow answers the other question: does each SHIPPED list still assemble
# from sources that exist? A renamed or deleted code file breaks a manifest,
# and that shows up here (on PRs too) instead of in a broken download.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# One release at a time: two pushes landing together must not race to replace
# the same tag. Don't cancel a run in progress -- a half-published release is
# worse than a redundant one.
concurrency:
  group: build-codelists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        run: apt-get update -qq && apt-get install -y --no-install-recommends python3

      - name: Regenerate headers from decomp
        run: python3 SyncFromDecomp.py

      # Fails fast and cheaply when a manifest names a file that has been
      # renamed or removed, before spending a build on the rest.
      - name: Validate the manifests
        run: python3 BuildCodeList.py --check

      - name: Build and package every code list
        run: python3 BuildCodeList.py --zip --summary dist/RELEASE_NOTES.md

      - name: Show what was built
        run: cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packaged lists
        uses: actions/upload-artifact@v4
        with:
          name: code-lists
          path: |
            dist/*.zip
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  # Publishing runs outside the devkitPro container: it needs no toolchain, and
  # the stock runner image is where the gh CLI lives.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the packaged lists
        uses: actions/download-artifact@v4
        with:
          name: code-lists
          path: dist

      - name: Publish the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Curated gecko code lists, built from main @ ${GITHUB_SHA::7}."
            echo
            echo "Each zip holds a **GYQE01.ini** that REPLACES the one in Project Rio's"
            echo "GameSettings folder -- don't merge it into your existing ini. Rio applies"
            echo "its Sys ini and your user ini both, so a code kept in each runs twice and"
            echo "hangs the boot."
            echo
            cat dist/RELEASE_NOTES.md
          } > notes.md

          # Replace the rolling release outright rather than uploading over it:
          # a list deleted from codelists/ has to stop being downloadable too.
          gh release delete codes-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create codes-latest dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Code lists (main @ ${GITHUB_SHA::7})" \
            --notes-file notes.md
